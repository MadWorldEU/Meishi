apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.api.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.api.name }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.api.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.api.name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: {{ .Values.api.name }}
          image: "{{ .Values.api.image.repository }}:{{ .Values.appVersion }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            # The Portal calls the API from the browser, so its origins must be allowed by CORS
            {{- $portalOrigins := list (printf "https://%s" .Values.ingress.domain) (printf "https://www.%s" .Values.ingress.domain) }}
            {{- range $index, $origin := concat $portalOrigins .Values.api.cors.extraAllowedOrigins }}
            - name: Cors__AllowedOrigins__{{ $index }}
              value: {{ $origin | quote }}
            {{- end }}
          resources:
            requests:
              cpu: {{ .Values.api.resources.requests.cpu | quote }}
              memory: {{ .Values.api.resources.requests.memory | quote }}
              ephemeral-storage: {{ index .Values.api.resources.requests "ephemeral-storage" | quote }}
            limits:
              cpu: {{ .Values.api.resources.limits.cpu | quote }}
              memory: {{ .Values.api.resources.limits.memory | quote }}
              ephemeral-storage: {{ index .Values.api.resources.limits "ephemeral-storage" | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.api.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.api.name }}
spec:
  selector:
    app: {{ .Values.api.name }}
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
      protocol: TCP