namespace: meishi
imagePullPolicy: "IfNotPresent"
appVersion: "v0.5.1"

clusterIssuer:
  enabled: false
  name: "letsencrypt-meishi"
  email: "info@meishi.dev"

ingress:
  className: "traefik"
  domain: "meishi.dev"
  tlsSecret: "meishi-tls"

api:
  name: api
  replicas: 1
  port: 8080
  image:
    repository: "ghcr.io/madworldeu/madworldeu-meishi-api"
  cors:
    # Origins that may call the API from a browser, on top of the Portal (https://<domain> and https://www.<domain>)
    extraAllowedOrigins: []
  # ASP.NET Core needs more memory than Nginx for the runtime and GC heap
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
      ephemeral-storage: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
      ephemeral-storage: "256Mi"

portal:
  name: portal
  replicas: 1
  port: 8080
  image:
    repository: "ghcr.io/madworldeu/madworldeu-meishi-portal"
  # Nginx serving the static Angular build needs very little CPU and memory
  resources:
    requests:
      cpu: "50m"
      memory: "32Mi"
      ephemeral-storage: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
      ephemeral-storage: "256Mi"

postgres:
  name: postgres
  port: 5432
  image:
    # Same major version as the integration tests
    repository: "postgres"
    tag: "17"
  username: "meishi"
  # Demo password for local development only. Production overrides it with --set postgres.password=...
  # from the POSTGRES_PASSWORD secret in the deploy workflow.
  password: "meishi-local-dev"
  # Same name as the database in the Aspire AppHost
  database: "meishi-db"
  storageSize: "1Gi"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
      ephemeral-storage: "64Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
      ephemeral-storage: "256Mi"

# Prepares the chart for Velero backups. Velero itself is installed from a separate repository;
# without Velero these annotations and labels have no effect.
backup:
  enabled: true
  # Max time the pre-backup hook (CHECKPOINT in PostgreSQL) may take before the backup fails
  hookTimeout: "2m"

migrationService:
  name: migration-service
  image:
    repository: "ghcr.io/madworldeu/madworldeu-meishi-migration-service"
  # Retries before the deployment fails, for example when the database is restarting
  backoffLimit: 3
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
      ephemeral-storage: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
      ephemeral-storage: "256Mi"

# Exposed through the ingress on pgadmin.<ingress.domain>
pgadmin:
  name: pgadmin
  port: 8080
  image:
    repository: "dpage/pgadmin4"
    tag: "9.18"
  # Demo login for local development only. Production overrides it with --set pgadmin.email=...
  # from the PGADMIN_EMAIL secret in the deploy workflow.
  email: "admin@meishi.dev"
  # Demo password for local development only. Production overrides it with --set pgadmin.password=...
  # from the PGADMIN_PASSWORD secret in the deploy workflow.
  password: "meishi-local-dev"
  # pgAdmin is a Python web app and needs more memory than the other services
  resources:
    requests:
      cpu: "50m"
      memory: "256Mi"
      ephemeral-storage: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
      ephemeral-storage: "512Mi"
