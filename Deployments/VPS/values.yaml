namespace: meishi
imagePullPolicy: "IfNotPresent"
appVersion: "v1.0.0"

clusterIssuer:
  enabled: true
  name: "letsencrypt-meishi"
  email: "info@meishi.dev"

ingress:
  className: "traefik"
  domain: "meishi.dev"
  tlsSecret: "meishi-tls"

portal:
  name: portal
  replicas: 1
  port: 8080
  image:
    repository: "ghcr.io/madworldeu/madworldeu-meishi-portal"
  # Nginx serving the static Angular build needs very little CPU and memory
  resources:
    requests:
      cpu: "50m"
      memory: "32Mi"
      ephemeral-storage: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
      ephemeral-storage: "256Mi"
