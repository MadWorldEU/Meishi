name: Build & Push Docker

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  packages: write

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: API
            dockerfile: Sources/MadWorldEU.Meishi.Controllers.Api/Dockerfile
            image: madworldeu-meishi-api
          - name: Migration Service
            dockerfile: Sources/MadWorldEU.Meishi.Controllers.MigrationService/Dockerfile
            image: madworldeu-meishi-migration-service
          - name: Portal
            dockerfile: Sources/MadWorldEU.Meishi.Controllers.Portal/Dockerfile
            image: madworldeu-meishi-portal
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 #v4.4.1

      - name: Set up QEMU for ARM64 builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 #v4.4.0
        with:
          platforms: arm64

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 #v4.7.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Resolve image tag
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            image_tag="${{ github.ref_name }}"
          else
            image_tag="latest"
          fi
          echo "image_tag=$image_tag" >> $GITHUB_OUTPUT
          echo "Using image tag: $image_tag"

      - name: Build & push ${{ matrix.name }}
        run: docker buildx build --platform linux/amd64,linux/arm64 -f ${{ matrix.dockerfile }} --tag ghcr.io/madworldeu/${{ matrix.image }}:${{ steps.tag.outputs.image_tag }} --push .