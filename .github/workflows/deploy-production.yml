name: Deploy production
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened]


permissions:
  contents: read

jobs:
  dry-run:
    if: true # github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 #v5

      - name: Dry run
        run: |
          helm template meishi Deployments/VPS \
            --values Deployments/VPS/values.yaml \
            --values Deployments/VPS/production-values.yaml \
            --set clusterIssuer.email="dry-run@example.com" > /dev/null
  
  deployment:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: vps-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 #v5

      - name: Write kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_CONTENT" | base64 -d  > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy
        env:
          IMAGE_TAG: ${{ github.ref_name }}
          CLUSTER_ISSUER_EMAIL: ${{ secrets.CLUSTER_ISSUER_EMAIL }}
        run: |
          helm upgrade --install meishi Deployments/VPS \
            --values Deployments/VPS/values.yaml \
            --values Deployments/VPS/production-values.yaml \
            --set clusterIssuer.email="$CLUSTER_ISSUER_EMAIL" \
            --wait \
            --timeout 5m