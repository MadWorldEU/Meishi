name: Deploy production
on:
  push:
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened]


permissions:
  contents: read

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 #v5.0.1

      - name: Dry run
        run: |
          helm template meishi Deployments/VPS \
            --values Deployments/VPS/values.yaml \
            --values Deployments/VPS/production-values.yaml \
            --set appVersion="dry-run" \
            --set clusterIssuer.email="dry-run@example.com" \
            --set postgres.password="dry-run" \
            --set pgadmin.email="dry-run@example.com" \
            --set pgadmin.password="dry-run" > /dev/null
  
  deployment:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: vps-production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 #v5.0.1

      - name: Write kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_CONTENT" | base64 -d  > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy
        env:
          IMAGE_TAG: ${{ github.ref_name }}
          CLUSTER_ISSUER_EMAIL: ${{ secrets.CLUSTER_ISSUER_EMAIL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PGADMIN_EMAIL: ${{ secrets.PGADMIN_EMAIL }}
          PGADMIN_PASSWORD: ${{ secrets.PGADMIN_PASSWORD }}
        run: |
          helm upgrade --install meishi Deployments/VPS \
            --values Deployments/VPS/values.yaml \
            --values Deployments/VPS/production-values.yaml \
            --set appVersion="$IMAGE_TAG" \
            --set clusterIssuer.email="$CLUSTER_ISSUER_EMAIL" \
            --set postgres.password="$POSTGRES_PASSWORD" \
            --set pgadmin.email="$PGADMIN_EMAIL" \
            --set pgadmin.password="$PGADMIN_PASSWORD" \
            --wait \
            --timeout 5m