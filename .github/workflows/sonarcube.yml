name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad #v6.1.0
        with:
          java-version: 17
          distribution: 'zulu'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 #v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: Sources/MadWorldEU.Meishi.Controllers.Portal/package-lock.json
      - name: Install Angular dependencies
        working-directory: Sources/MadWorldEU.Meishi.Controllers.Portal
        run: npm ci --ignore-scripts
      - name: Build Angular portal
        working-directory: Sources/MadWorldEU.Meishi.Controllers.Portal
        run: npm run build
      - name: Test Angular portal with coverage
        working-directory: Sources/MadWorldEU.Meishi.Controllers.Portal
        run: |
          npm run test:coverage
          # SonarScanner for .NET resolves relative paths against each project's directory, so make the lcov paths absolute.
          sed -i "s|^SF:|SF:$PWD/|" coverage/MadWorldEU.Meishi.Controllers.Portal/lcov.info
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ~/.sonar/scanner
      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ~/.sonar/scanner/dotnet-sonarscanner begin \
            /k:"MadWorldEU_Meishi" \
            /o:"madworldeu" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml" \
            /d:sonar.javascript.lcov.reportPaths="${{ github.workspace }}/Sources/MadWorldEU.Meishi.Controllers.Portal/coverage/MadWorldEU.Meishi.Controllers.Portal/lcov.info" \
            /d:sonar.coverage.exclusions="Sources/MadWorldEU.Meishi.AppHost/**/*,**/DebugEndpoints.cs,Sources/MadWorldEU.Meishi.Controllers.Portal/**/*.spec.ts"
          dotnet restore Meishi.slnx
          dotnet build Meishi.slnx --no-restore
          dotnet-coverage collect "dotnet test Meishi.slnx --no-build" -f xml -o coverage.xml
          ~/.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"