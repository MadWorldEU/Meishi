# This workflow will build the .NET solution and the Angular portal
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build and Test

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  dotnet:
    name: .NET build

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --verbosity normal

  angular:
    name: Angular build

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Sources/MadWorldEU.Meishi.Controllers.Portal

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: Sources/MadWorldEU.Meishi.Controllers.Portal/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
